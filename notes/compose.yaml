services:
  webtop:
    image: lscr.io/linuxserver/webtop:arch-kde
    container_name: webtop
    environment:
      - PUID=1000        # from `id your_user`
      - PGID=1000
      - TZ=Etc/UTC
      - CUSTOM_USER=admin      # optional basic auth
      - PASSWORD=changeme
    volumes:
      - .:/config  # home dir, keeps settings across recreates
    ports:
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
